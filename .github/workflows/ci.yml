name: Python package
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine pytest
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install dist/*.whl
      - run: python -m pytest -q tests
        env:
          OPENIF_TEST_MODEL: "1"
      - name: Test source distribution outside checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.tar.gz
          cd "$RUNNER_TEMP"
          python -I -c 'from openif import Classifier; m = Classifier.from_pretrained("openif/gpr-1-nasubi-massive", local_files_only=True); assert m.predict("明日の天気を教えて") == "weather_query"'
        env:
          HF_HUB_OFFLINE: "1"
