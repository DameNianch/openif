[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openif"
version = "0.1.0"
description = "Japanese intent classification with GPR-1 Nasubi"
readme = "README.md"
license-files = ["NOTICE.md"]
authors = [{name = "DameNianch"}]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy==2.3.5",
    "scipy==1.17.0",
    "scikit-learn==1.8.0",
    "joblib==1.5.3",
    "SudachiPy==0.6.11",
    "SudachiDict-core==20260428",
    "fugashi==1.5.2",
    "unidic-lite==1.0.8",
    "huggingface-hub==1.33.0",
    "httpx>=0.27,<1",
]

[project.urls]
Repository = "https://github.com/DameNianch/openif"
Model = "https://huggingface.co/openif/gpr-1-nasubi-massive"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openif = ["py.typed"]
"openif.architectures.gpr_1_nasubi" = ["lexicon.json"]
